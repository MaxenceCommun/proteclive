<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>HUD Sujet — PROTEC LIVE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@900&family=Orbitron:wght@700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Poppins', sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* Conteneur principal du HUD Sujet calé en bas au-dessus du ticker de jeu.html (100% de largeur) */
        .topic-hud {
            position: absolute;
            bottom: 45px; /* Juste au-dessus du ticker de jeu.html qui fait 45px */
            left: 0;
            width: 1920px;
            height: 95px;
            display: flex;
            align-items: center;
            z-index: 10;
            overflow: hidden;
            transform: translateX(-100%);
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        /* Quand actif, le bandeau glisse depuis la gauche */
        .topic-hud.active {
            transform: translateX(0);
        }

        /* L'arrière-plan du bandeau avec effet Glassmorphism */
        .topic-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #04376b 0%, #024589 100%);
            backdrop-filter: blur(10px);
            border-top: 3px solid #f68d20;
            border-bottom: 3px solid #f68d20;
            z-index: 1;
        }

        /* Le badge orange biseauté */
        .topic-badge {
            position: relative;
            z-index: 2;
            height: 100%;
            background: #f68d20;
            color: #ffffff;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 30px 0 35px;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
            box-shadow: 10px 0 30px rgba(246, 141, 32, 0.3);
        }

        /* Conteneur de textes */
        .topic-text {
            position: relative;
            z-index: 2;
            margin-left: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Titre du sujet */
        .topic-title {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            line-height: 1.2;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        /* Sous-titre */
        .topic-subtitle {
            font-size: 16px;
            color: #f68d20;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 3px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }

        /* Balayage de brillance sur le badge */
        .topic-badge::after {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 80%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            transform: skewX(-30deg);
            animation: badgeGlint 5s infinite linear;
        }

        @keyframes badgeGlint {
            0% { left: -150%; }
            30%, 100% { left: 250%; }
        }

        /* Indicateur interactif discret pour les tests */
        .click-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 12px;
            color: rgba(255,255,255,0.2);
            font-family: sans-serif;
            pointer-events: none;
            user-select: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        body:hover .click-hint {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="topic-hud" id="topicHud">
        <div class="topic-bg"></div>
        <div class="topic-badge" id="topicBadge">
            <i class="fa-solid fa-bullhorn" id="topicIcon"></i>
        </div>
        <div class="topic-text">
            <div class="topic-title" id="topicTitle">CHARGEMENT DU SUJET...</div>
            <div class="topic-subtitle" id="topicSubtitle">Veuillez renseigner le sujet dans config/config.js</div>
        </div>
    </div>

    <div class="click-hint">Cliquez sur l'écran pour afficher / masquer le bandeau</div>

    <!-- Configuration globale -->
    <script src="get_config.php?format=js"></script>
    <script src="config/config.js"></script>
    <script>
        const hud = document.getElementById('topicHud');

        // Mettre à jour le HUD en direct sans recharger la page
        function updateHUD() {
            if (typeof CONFIG !== 'undefined' && CONFIG.discussion) {
                const topicTitleEl = document.getElementById('topicTitle');
                const topicSubtitleEl = document.getElementById('topicSubtitle');
                const topicIconEl = document.getElementById('topicIcon');
                
                // Textes
                if (CONFIG.discussion.topic) {
                    topicTitleEl.textContent = CONFIG.discussion.topic;
                }
                if (CONFIG.discussion.subTopic) {
                    topicSubtitleEl.textContent = CONFIG.discussion.subTopic;
                    topicSubtitleEl.style.display = '';
                } else {
                    topicSubtitleEl.style.display = 'none';
                }

                // Icône
                if (CONFIG.discussion.icon) {
                    topicIconEl.className = `fa-solid ${CONFIG.discussion.icon}`;
                    document.getElementById('topicBadge').style.display = 'flex';
                } else {
                    document.getElementById('topicBadge').style.display = 'none';
                }

                // Visibilité contrôlée en direct
                if (CONFIG.discussion.visible) {
                    hud.classList.add('active');
                } else {
                    hud.classList.remove('active');
                }
            }
        }

        // Chargement initial
        window.addEventListener('DOMContentLoaded', () => {
            updateHUD();

            // Déclencher l'animation d'apparition après un court délai si visible = true
            if (typeof CONFIG !== 'undefined' && CONFIG.discussion && CONFIG.discussion.visible) {
                setTimeout(() => {
                    hud.classList.add('active');
                }, 300);
            }
        });

        // Toggle d'affichage au clic (pour test interactif dans OBS)
        document.body.addEventListener('click', () => {
            const isNowActive = hud.classList.toggle('active');
            
            // Mettre à jour le localStorage pour que la régie voie le changement
            if (typeof CONFIG !== 'undefined' && CONFIG.discussion) {
                CONFIG.discussion.visible = isNowActive;
                localStorage.setItem('protec_cached_config', JSON.stringify(CONFIG));
            }
        });
    </script>
</body>
</html>
