<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Technique — PROTEC LIVE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="images/logo ProtecLive.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@900&family=Orbitron:wght@700&display=swap');
        body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: radial-gradient(circle at center, #024589 0%, #04376b 100%); color: white; font-family: 'Poppins', sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; overflow: hidden; position: relative; }
        
        .warn-icon { font-size: 100px; color: #f68d20; animation: pulse 2s infinite; margin-bottom: 20px; }
        .title { 
            font-size: 60px; 
            font-weight: 900; 
            font-family: 'Orbitron', sans-serif; 
            letter-spacing: 5px; 
            background: linear-gradient(to bottom, #ffffff 30%, #d8e1e9 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .desc { font-size: 24px; max-width: 800px; color: #ccc; line-height: 1.6; margin-top: 20px; }

        .logo-bg { position: absolute; top: 50px; width: 150px; opacity: 0.3; }
        .footer { position: absolute; bottom: 60px; font-family: 'Orbitron'; color: #f68d20; font-size: 20px; letter-spacing: 3px; }

        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.05); } }
    </style>
</head>
<body>
    <img src="images/logo_png.png" class="logo-bg">
    <div class="warn-icon"><i class="fas fa-tools"></i></div>
    <div class="title">PAUSE TECHNIQUE</div>
    <p class="desc">Nous effectuons un réglage ou résolvons un léger problème technique. Pas d'inquiétude, le live reprend dans quelques instants !</p>
    <div class="footer">RÉGLAGES EN COURS...</div>
</body>
</html>
