<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Caméras Intervenants — PROTEC LIVE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="images/logo ProtecLive.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&family=Orbitron:wght@700;900&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .cameras-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            background: transparent;
            transition: all 0.8s ease;
        }

        .video-box {
            position: absolute;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: linear-gradient(135deg, rgba(4, 55, 107, 0.4) 0%, rgba(2, 69, 137, 0.4) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 4px solid #f68d20;
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
            z-index: 1;
        }

        .video-box.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            z-index: 2;
        }

        .video-box iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        /* --- STYLES DES LABELS (NAMEPLATES) --- */
        .speaker-label {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: linear-gradient(135deg, rgba(4, 55, 107, 0.95) 0%, rgba(2, 69, 137, 0.95) 100%);
            border-left: 4px solid #f68d20;
            border-radius: 0 8px 8px 0;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .speaker-icon {
            color: #f68d20;
            font-size: 16px;
        }

        .speaker-info {
            display: flex;
            flex-direction: column;
        }

        .speaker-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .speaker-role {
            font-size: 10px;
            color: #d1d5db;
        }

        .speaker-apc {
            font-size: 10px;
            color: #f68d20;
            font-weight: 700;
            margin-top: 2px;
            display: none;
        }

        .speaker-icon.speaking {
            animation: pulse-speaker 0.5s infinite alternate;
            color: #10b981;
        }

        @keyframes pulse-speaker {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px #10b981); }
            100% { transform: scale(1.3); filter: drop-shadow(0 0 10px #10b981); }
        }

        /* --- POSITIONNEMENTS LAYOUTS EN CSS --- */

        /* LAYOUT SOLO */
        .cameras-container.layout-solo .video-box {
            top: 40px;
            left: 40px;
            width: 1840px;
            height: 1000px;
        }

        /* LAYOUT DUO */
        .cameras-container.layout-duo .video-box.duo-left {
            top: 140px;
            left: 40px;
            width: 890px;
            height: 800px;
        }
        .cameras-container.layout-duo .video-box.duo-right {
            top: 140px;
            right: 40px;
            width: 890px;
            height: 800px;
        }

        /* LAYOUT GRID (Mosaïque) */
        .cameras-container.layout-grid #box-speaker1 {
            top: 40px;
            left: 40px;
            width: 890px;
            height: 470px;
        }
        .cameras-container.layout-grid #box-speaker2 {
            top: 40px;
            right: 40px;
            width: 890px;
            height: 470px;
        }
        .cameras-container.layout-grid #box-speaker3 {
            bottom: 40px;
            left: 40px;
            width: 890px;
            height: 470px;
        }
        .cameras-container.layout-grid #box-speaker4 {
            bottom: 40px;
            right: 40px;
            width: 890px;
            height: 470px;
        }

        /* Mode Aucun */
        .cameras-container.layout-none .video-box {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="cameras-container layout-none" id="cameras-container">
        <!-- Intervenant 1 -->
        <div class="video-box" id="box-speaker1">
            <iframe id="iframe-speaker1" src="" allow="autoplay;camera;microphone;fullscreen"></iframe>
            <div class="speaker-label">
                <i class="fa-solid fa-user speaker-icon"></i>
                <div class="speaker-info">
                    <span class="speaker-name">Intervenant 1</span>
                    <span class="speaker-role">Rôle</span>
                    <span class="speaker-apc"></span>
                </div>
            </div>
        </div>

        <!-- Intervenant 2 -->
        <div class="video-box" id="box-speaker2">
            <iframe id="iframe-speaker2" src="" allow="autoplay;camera;microphone;fullscreen"></iframe>
            <div class="speaker-label">
                <i class="fa-solid fa-user speaker-icon"></i>
                <div class="speaker-info">
                    <span class="speaker-name">Intervenant 2</span>
                    <span class="speaker-role">Rôle</span>
                    <span class="speaker-apc"></span>
                </div>
            </div>
        </div>

        <!-- Intervenant 3 -->
        <div class="video-box" id="box-speaker3">
            <iframe id="iframe-speaker3" src="" allow="autoplay;camera;microphone;fullscreen"></iframe>
            <div class="speaker-label">
                <i class="fa-solid fa-user speaker-icon"></i>
                <div class="speaker-info">
                    <span class="speaker-name">Intervenant 3</span>
                    <span class="speaker-role">Rôle</span>
                    <span class="speaker-apc"></span>
                </div>
            </div>
        </div>

        <!-- Intervenant 4 -->
        <div class="video-box" id="box-speaker4">
            <iframe id="iframe-speaker4" src="" allow="autoplay;camera;microphone;fullscreen"></iframe>
            <div class="speaker-label">
                <i class="fa-solid fa-user speaker-icon"></i>
                <div class="speaker-info">
                    <span class="speaker-name">Intervenant 4</span>
                    <span class="speaker-role">Rôle</span>
                    <span class="speaker-apc"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Configuration globale -->
    <script src="get_config.php?format=js"></script>
    <script src="config/config.js"></script>
    <script>
        // Demander l'audio level à toutes les iframes
        function requestLoudness() {
            for (let i = 1; i <= 4; i++) {
                const iframe = document.getElementById(`iframe-speaker${i}`);
                if (iframe && iframe.contentWindow && iframe.src.includes('vdo.ninja')) {
                    iframe.contentWindow.postMessage({ getLoudness: true }, "*");
                }
            }
        }

        // Ecouter les messages de l'iframe
        window.addEventListener("message", (e) => {
            if (e.data && e.data.action === "loudness") {
                // e.data.loudness est la valeur audio
                // Retrouver de quelle iframe ça vient
                for (let i = 1; i <= 4; i++) {
                    const iframe = document.getElementById(`iframe-speaker${i}`);
                    if (iframe && iframe.contentWindow === e.source) {
                        const iconEl = document.getElementById(`box-speaker${i}`).querySelector('.speaker-icon');
                        // VDO.Ninja loudness est souvent une valeur normalisée, on va vérifier si elle dépasse un seuil
                        let isSpeaking = false;
                        if (typeof e.data.loudness === 'number') {
                            isSpeaking = e.data.loudness > 10;
                        } else if (typeof e.data.loudness === 'object') {
                            // Parfois c'est un dictionnaire par streamID
                            for (let key in e.data.loudness) {
                                if (e.data.loudness[key] > 10) isSpeaking = true;
                            }
                        }
                        
                        if (isSpeaking) {
                            iconEl.classList.add('speaking');
                        } else {
                            iconEl.classList.remove('speaking');
                        }
                        break;
                    }
                }
            }
        });

        function updateHUD() {
            if (typeof CONFIG === 'undefined') return;

            const container = document.getElementById('cameras-container');
            const layout = CONFIG.cameras?.layout || 'none';
            
            // Appliquer la classe de layout au conteneur
            container.className = 'cameras-container layout-' + layout;
            
            // Réinitialiser les classes positionnelles duo
            for (let i = 1; i <= 4; i++) {
                const box = document.getElementById(`box-speaker${i}`);
                if (box) {
                    box.classList.remove('duo-left', 'duo-right');
                }
            }

            // Définir les sources pour chaque slot (4 boîtes)
            let slotAssignments = [null, null, null, null];

            if (layout === 'solo') {
                slotAssignments[0] = CONFIG.cameras?.soloSpeaker;
            } else if (layout === 'duo') {
                slotAssignments[0] = CONFIG.cameras?.duoLeftSpeaker;
                slotAssignments[1] = CONFIG.cameras?.duoRightSpeaker;
                document.getElementById('box-speaker1').classList.add('duo-left');
                document.getElementById('box-speaker2').classList.add('duo-right');
            } else if (layout === 'grid') {
                slotAssignments[0] = CONFIG.cameras?.gridTopLeft;
                slotAssignments[1] = CONFIG.cameras?.gridTopRight;
                slotAssignments[2] = CONFIG.cameras?.gridBottomLeft;
                slotAssignments[3] = CONFIG.cameras?.gridBottomRight;
            }

            // Mettre à jour chaque slot
            for (let i = 0; i < 4; i++) {
                const box = document.getElementById(`box-speaker${i+1}`);
                const iframe = document.getElementById(`iframe-speaker${i+1}`);
                const assignment = slotAssignments[i];
                
                let isActive = false;

                if (assignment) {
                    const parts = assignment.split('_'); // ex: ['speaker1', 'cam'] ou ['speaker1', 'screen']
                    const speakerKey = parts[0];
                    const type = parts[1];
                    const speaker = CONFIG.speakers?.[speakerKey];
                    
                    if (speaker) {
                        const targetVdoId = type === 'screen' ? speaker.vdoScreenId : speaker.vdoId;
                        
                        if (targetVdoId) {
                            isActive = true;
                            // Mettre à jour le texte du label
                            const nameEl = box.querySelector('.speaker-name');
                            const roleEl = box.querySelector('.speaker-role');
                            const iconEl = box.querySelector('.speaker-icon');
                            const apcEl = box.querySelector('.speaker-apc');
                            
                            if (nameEl) nameEl.textContent = speaker.name + (type === 'screen' ? ' (Écran)' : '');
                            if (roleEl) roleEl.textContent = speaker.role || '';
                            if (apcEl) {
                                if (speaker.apc) {
                                    apcEl.textContent = speaker.apc;
                                    apcEl.style.display = 'block';
                                } else {
                                    apcEl.style.display = 'none';
                                }
                            }
                            if (iconEl && speaker.icon) {
                                iconEl.className = `fa-solid ${speaker.icon} speaker-icon`;
                            }

                            box.classList.add('active');
                            const targetSrc = `https://vdo.ninja/?view=${targetVdoId}&autoplay&transparent&nonav&logo=0&codec=h264`;
                            if (iframe.src !== targetSrc) {
                                iframe.src = targetSrc;
                                // Demander le loudness quand l'iframe a fini de charger
                                iframe.onload = () => {
                                    setTimeout(() => {
                                        if (iframe.contentWindow) {
                                            iframe.contentWindow.postMessage({ getLoudness: true }, "*");
                                        }
                                    }, 2000);
                                };
                            }
                        }
                    }
                }

                if (!isActive) {
                    box.classList.remove('active');
                    // Libérer l'iframe après la transition
                    setTimeout(() => {
                        if (!box.classList.contains('active')) {
                            iframe.src = '';
                            const iconEl = box.querySelector('.speaker-icon');
                            if(iconEl) iconEl.classList.remove('speaking');
                        }
                    }, 800);
                }
            }
        }

        // Lancer la première mise à jour
        window.addEventListener('DOMContentLoaded', updateHUD);
    </script>
</body>
</html>
